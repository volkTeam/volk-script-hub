<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volk Script Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">VOLK HUB</div>
        <div class="controls">
            <button id="music-btn">🎵</button>
            <button id="admin-btn">⚙️</button>
        </div>
    </header>

    <main>
        <div class="search-box">
            <input type="text" placeholder="Поиск скриптов...">
        </div>
        <div id="scripts-container">
            <!-- Тут будут скрипты -->
            <div class="script-card">
                <h3>Пример скрипта</h3>
                <p>Игра: Blox Fruits</p>
                <button>Скопировать</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
