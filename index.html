<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volk Script Hub</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <!-- Счётчик слева (Админы в секрете!) -->
    <div class="online-stats">
      <span>👀 Гости: <b id="guestsCount">1</b></span>
      <span>🎨 Креаторы: <b id="creatorsCount">0</b></span>
    </div>

    <div class="logo" onclick="showPage('mainPage')">🐺 Volk Hub</div>
    
    <div class="settings-wrapper">
      <button id="settingsToggleBtn" class="settings-btn">⚙️</button>
      
      <div id="dropdownMenu" class="dropdown-menu">
        <h3>⚙️ Настройки Hub</h3>
        <button class="menu-btn" onclick="toggleMusic()">🎵 Включить / Выключить музыку</button>
        <button id="adminPanelBtn" class="menu-btn" style="display:none; background:#b91c1c; margin-top:6px;" onclick="showPage('adminPanelPage')">🛡️ Панель Модерации</button>
        <hr>

        <div id="authBlock">
          <h4>Регистрация / Вход</h4>
          <input type="email" id="userEmail" placeholder="Email">
          <input type="text" id="userName" placeholder="Имя пользователя">
          <input type="password" id="userPass" placeholder="Пароль">
          <button class="primary-btn" onclick="registerUser()">Войти / Зарегистрироваться</button>
        </div>

        <div id="userInfo" style="display:none;">
          <p>Вы вошли как: <b id="currentUserText"></b></p>
          <p>Роль: <span id="currentRoleText"></span></p>
        </div>
        <hr>

        <div class="admin-block">
          <h4>🔑 Стать Админом</h4>
          <input type="password" id="adminKeyInput" placeholder="Введите ключ">
          <button class="danger-btn" onclick="becomeAdmin()">Активировать админку</button>
        </div>
      </div>
    </div>
  </header>

  <!-- СТРАНИЦА 1: ГЛАВНАЯ (ЛЕНТА, ФИЛЬТРЫ И ПОИСК) -->
  <section id="mainPage" class="page-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск скриптов или игр..." oninput="applyFilters()">
    </div>

    <!-- Быстрые Фильтры -->
    <div class="filter-bar">
      <button class="filter-chip active" onclick="setFilter('all', this)">Все</button>
      <button class="filter-chip" onclick="setFilter('popular', this)">🔥 Популярные</button>
      <button class="filter-chip" onclick="setFilter('keyless', this)">⚡ Без ключа</button>
      <button class="filter-chip" onclick="setFilter('mobile', this)">📱 Mobile</button>
      <button class="filter-chip" onclick="setFilter('favs', this)">⭐ Избранное</button>
    </div>

    <div id="createScriptArea" style="display:none; margin-bottom: 15px;">
      <button class="create-script-main-btn" onclick="goToMakeScript()">➕ Сделать скрипт (Make Script)</button>
    </div>

    <main id="scriptsContainer" class="scripts-grid">
      <p>Загрузка скриптов...</p>
    </main>
  </section>

  <!-- СТРАНИЦА 2: MAKE SCRIPT -->
  <section id="makeScriptPage" class="page-section" style="display:none;">
    <div class="make-script-container">
      <div class="page-header">
        <h2>📝 Публикация Скрипта</h2>
        <button class="secondary-btn" onclick="showPage('mainPage')">⬅️ Назад</button>
      </div>

      <div class="form-row">
        <label>1. Основная информация:</label>
        <input type="text" id="scriptTitle" placeholder="Имя для скрипта (напр. Auto Farm V3)">
        <input type="text" id="scriptGame" placeholder="Название игры (напр. Blox Fruits)">
      </div>

      <div class="form-row">
        <label>2. Параметры скрипта:</label>
        <div class="options-grid">
          <select id="scriptKeyType">
            <option value="keyless">⚡ Без ключа (Keyless)</option>
            <option value="key">🔑 Нужен ключ (Key System)</option>
          </select>
          <select id="scriptPlatform">
            <option value="all">💻+📱 PC & Mobile</option>
            <option value="mobile">📱 Только Mobile</option>
            <option value="pc">💻 Только PC</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label>3. Код скрипта (Lua / Luau / Loadstring):</label>
        <textarea id="scriptCode" rows="8" placeholder="loadstring(game:HttpGet('https://raw.githubusercontent.com/...'))()"></textarea>
      </div>

      <div class="form-row">
        <button class="publish-big-btn" onclick="publishScript()">🚀 Опубликовать скрипт</button>
      </div>
    </div>
  </section>

  <!-- СТРАНИЦА 3: ПАНЕЛЬ МОДЕРАЦИИ (ТОЛЬКО ДЛЯ АДМИНА) -->
  <section id="adminPanelPage" class="page-section" style="display:none;">
    <div class="make-script-container">
      <div class="page-header">
        <h2>🛡️ Панель Модерации</h2>
        <button class="secondary-btn" onclick="showPage('mainPage')">⬅️ Назад</button>
      </div>
      <h3>🚩 Поступившие жалобы</h3>
      <div id="reportsContainer" style="margin-top:10px;">
        <p>Загрузка жалоб...</p>
      </div>
    </div>
  </section>

  <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
